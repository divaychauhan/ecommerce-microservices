name: cart-service CI and security scan
on:
  pull_request:
    paths:
      - 'services/cart-service/**'
      - '.github/workflows/cart-service-ci.yaml'
  push:
    branches: [main]
    paths:
      - 'services/cart-service/**'
      - '.github/workflows/cart-service-ci.yaml'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  build-and-scan:
    name: Build and scan cart-service
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t cart-service:ci ./services/cart-service
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: cart-service:ci
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
      - name: Upload Trivy report to GitHub Code Scanning
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
