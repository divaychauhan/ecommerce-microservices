name: Repository validation
on:
  pull_request:
    paths: ['frontend/**','nginx/**','docker-compose.yml','.github/workflows/repository-ci.yaml']
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Check frontend files exist
        run: test -s frontend/index.html && test -s frontend/styles.css && test -s frontend/app.js
