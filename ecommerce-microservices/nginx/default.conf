server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 2m;

    location /api/users/ { proxy_pass http://user-service:8000/; include /etc/nginx/conf.d/proxy-headers.conf; }
    location /api/products/ { proxy_pass http://product-service:8000/; include /etc/nginx/conf.d/proxy-headers.conf; }
    location /api/cart/ { proxy_pass http://cart-service:8000/; include /etc/nginx/conf.d/proxy-headers.conf; }
    location /api/orders/ { proxy_pass http://order-service:8000/; include /etc/nginx/conf.d/proxy-headers.conf; }
    location /api/payments/ { proxy_pass http://payment-service:8000/; include /etc/nginx/conf.d/proxy-headers.conf; }
    location /api/inventory/ { proxy_pass http://inventory-service:8000/; include /etc/nginx/conf.d/proxy-headers.conf; }
    location /api/notifications/ { proxy_pass http://notification-service:8000/; include /etc/nginx/conf.d/proxy-headers.conf; }

    location / { try_files $uri $uri/ /index.html; }
}
